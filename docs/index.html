    <title>Our World</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080610;
        color: #f7f1f3;
      }
      #loading-curtain {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        cursor: pointer;
        background:
          radial-gradient(ellipse 84% 58% at 50% 54%, rgba(238, 174, 198, 0.14) 0%, rgba(154, 178, 232, 0.08) 42%, transparent 74%),
          radial-gradient(ellipse 90% 52% at 50% 96%, rgba(236, 182, 162, 0.13) 0%, transparent 72%),
          linear-gradient(180deg, #07050f 0%, #100c1d 52%, #1a1228 100%);
        transition:
          opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1),
          transform 1.35s cubic-bezier(0.22, 1, 0.36, 1),
          filter 1.25s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 1.3s ease;
      }
      #loading-curtain.is-completing .lc-heart-stage {
        transform: scale(1.06);
      }
      #loading-curtain.is-dissolving {
        opacity: 0;
        transform: scale(1.045);
        filter: blur(14px);
        visibility: hidden;
        pointer-events: none;
      }
      #lc-ambient-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }
      .lc-aurora-silk {
        position: absolute;
        inset: -20% -15%;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(ellipse 46% 36% at 36% 42%, rgba(242, 178, 204, 0.13), transparent 72%),
          radial-gradient(ellipse 44% 36% at 64% 54%, rgba(164, 198, 246, 0.12), transparent 72%);
        filter: blur(34px);
        animation: lcSilkFloat 8.5s ease-in-out infinite alternate;
      }
      @keyframes lcSilkFloat {
        0% { transform: translate3d(-2%, -1.5%, 0) scale(0.97); opacity: 0.78; }
        100% { transform: translate3d(2%, 1.5%, 0) scale(1.05); opacity: 1; }
      }
      .lc-heart-stage {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        perspective: 700px;
        transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .lc-sculpture-wrap {
        position: relative;
        width: clamp(148px, 21vmin, 192px);
        height: clamp(148px, 21vmin, 192px);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotateX(var(--lc-tilt-x, 0deg)) rotateY(var(--lc-tilt-y, 0deg));
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .lc-sculpture-wrap:hover {
        filter: drop-shadow(0 0 22px rgba(245, 196, 214, 0.28));
      }
      .lc-heart-halo {
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 194, 212, 0.22) 0%, rgba(176, 206, 248, 0.10) 48%, transparent 72%);
        filter: blur(12px);
        animation: lcHeartbeatHalo 3.2s ease-in-out infinite;
      }
      @keyframes lcHeartbeatHalo {
        0%, 100% { transform: scale(0.94); opacity: 0.68; }
        28% { transform: scale(1.06); opacity: 0.96; }
        46% { transform: scale(0.98); opacity: 0.80; }
        64% { transform: scale(1.09); opacity: 1; }
      }
      .lc-heart-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .lc-nested-outer {
        transform-origin: 100px 100px;
        animation: lcNestedPulse 3.2s ease-in-out infinite;
      }
      .lc-nested-mid {
        transform-origin: 100px 102px;
        animation: lcNestedPulse 3.2s ease-in-out 0.18s infinite;
      }
      .lc-nested-inner {
        transform-origin: 100px 104px;
        animation: lcNestedPulse 3.2s ease-in-out 0.34s infinite;
      }
      @keyframes lcNestedPulse {
        0%, 100% { transform: scale(0.985); opacity: 0.56; }
        32% { transform: scale(1.03); opacity: 0.90; }
        52% { transform: scale(0.995); opacity: 0.72; }
        70% { transform: scale(1.045); opacity: 0.98; }
      }
      .lc-orbit-ring {
        transform-origin: 100px 100px;
        animation: lcSpinSlow 26s linear infinite;
      }
      @keyframes lcSpinSlow {
        to { transform: rotate(360deg); }
      }
      .lc-minimal-title {
        margin: 0;
        font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(24px, 3.1vw, 34px);
        letter-spacing: 0.14em;
        color: rgba(250, 236, 240, 0.92);
        text-shadow: 0 4px 26px rgba(244, 186, 208, 0.28);
        animation: lcTitleBreathe 4.2s ease-in-out infinite alternate;
      }
      @keyframes lcTitleBreathe {
        0% { opacity: 0.76; letter-spacing: 0.13em; }
        100% { opacity: 0.98; letter-spacing: 0.16em; }
      }

  <body>
    <div id="loading-curtain" role="status" aria-label="Loading Our World">

              <linearGradient id="lcMoonArc" x1="100" y1="164" x2="100" y2="42" gradientUnits="userSpaceOnUse">

              <path d="M100 189.5C100 189.5 95.5 186.2 95.5 183.3C95.5 181.7 96.8 180.5 98.3 180.5C99.2 180.5 99.7 181 100 181.7C100.3 181 100.8 180.5 101.7 180.5C103.2 180.5 104.5 181.7 104.5 183.3C104.5 186.2 100 189.5 100 189.5Z" fill="#bfd8fa" fill-opacity="0.78" />

            <path

            <!-- Left & Right Progress Ribbons (Light Fury Blush-Rose & Night Fury Moonlit-Blue) -->

            <!-- Luminous heart-core star -->

            <path

              d="M100 103 C100 103 91 97 91 90.8 C91 87.8 93.4 85.8 96 85.8 C97.9 85.8 99.3 87 100 88.4 C100.7 87 102.1 85.8 104 85.8 C106.6 85.8 109 87.8 109 90.8 C109 97 100 103 100 103 Z"
              fill="#fff3f7"

        <h1 class="lc-minimal-title">Our World</h1>

    <script>
      (function () {
        var curtain = document.getElementById('loading-curtain');
        var wrap = document.getElementById('lc-sculpture-wrap');
        var canvas = document.getElementById('lc-ambient-canvas');
        if (!canvas || !canvas.getContext || !curtain) return;
        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = 0, h = 0, rafId = 0, start = performance.now();
        var pointer = { x: 0.5, y: 0.5, active: false, lastSpawn: 0 };

        function resize() {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.max(1, Math.floor(w * dpr));
          canvas.height = Math.max(1, Math.floor(h * dpr));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function drawHeart(cx, cy, size, rot, color, alpha) {
          if (alpha <= 0.004) return;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          ctx.scale(size, size);
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, 0.55);
          ctx.bezierCurveTo(-0.95, -0.1, -0.95, -0.82, -0.44, -0.82);
          ctx.bezierCurveTo(-0.18, -0.82, -0.04, -0.62, 0, -0.46);
          ctx.bezierCurveTo(0.04, -0.62, 0.18, -0.82, 0.44, -0.82);
          ctx.bezierCurveTo(0.95, -0.82, 0.95, -0.1, 0, 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        var palette = ['#f6bfd3', '#fbe1d4', '#c5dcfa', '#f3acc6'];
        var floaters = [];
        for (var i = 0; i < 34; i++) {
          floaters.push({
            x: Math.random(),
            y: Math.random(),
            size: 3.4 + Math.random() * 6.2,
            vy: 0.016 + Math.random() * 0.028,
            swayAmp: 0.012 + Math.random() * 0.022,
            phase: Math.random() * 6.283,
            color: palette[i % palette.length],
            isHeart: i % 3 !== 2
          });
        }

        var bursts = [];
        var ripples = [];

        function spawnHeartBurst(px, py, count) {
          ripples.push({ x: px, y: py, r: 6, alpha: 0.55 });
          for (var k = 0; k < count; k++) {
            var ang = -1.57 + (Math.random() - 0.5) * 2.5;
            var spd = 28 + Math.random() * 68;
            bursts.push({
              x: px,
              y: py,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 22,
              size: 4.5 + Math.random() * 6.5,
              rot: (Math.random() - 0.5) * 0.65,
              life: 0,
              maxLife: 1.15 + Math.random() * 0.65,
              color: palette[k % palette.length]
            });
          }
        }

        function onMove(ev) {
          if (!w || !h) return;
          pointer.x = ev.clientX / w;
          pointer.y = ev.clientY / h;
          pointer.active = true;
          if (wrap) {
            var tx = (0.5 - pointer.y) * 14;
            var ty = (pointer.x - 0.5) * 16;
            wrap.style.setProperty('--lc-tilt-x', tx.toFixed(2) + 'deg');
            wrap.style.setProperty('--lc-tilt-y', ty.toFixed(2) + 'deg');
          }
          var now = performance.now();
          if (now - pointer.lastSpawn > 52 && bursts.length < 72) {
            pointer.lastSpawn = now;
            bursts.push({
              x: ev.clientX + (Math.random() - 0.5) * 12,
              y: ev.clientY + (Math.random() - 0.5) * 12,
              vx: (Math.random() - 0.5) * 20,
              vy: -18 - Math.random() * 26,
              size: 3.4 + Math.random() * 4.2,
              rot: (Math.random() - 0.5) * 0.5,
              life: 0,
              maxLife: 0.95 + Math.random() * 0.45,
              color: palette[(Math.random() * palette.length) | 0]
            });
          }
        }

        function onTap(ev) {
          spawnHeartBurst(ev.clientX, ev.clientY, 10);
        }

        curtain.addEventListener('pointermove', onMove, { passive: true });
        curtain.addEventListener('pointerdown', onTap, { passive: true });

        var prevNow = start;
        function frame(now) {
          if (!document.getElementById('loading-curtain')) {
            window.removeEventListener('resize', resize);
            return;
          }
          var dt = Math.min(0.05, (now - prevNow) * 0.001);
          prevNow = now;
          var t = (now - start) * 0.001;
          ctx.clearRect(0, 0, w, h);

          // 1. Ambient drifting romantic micro-hearts & stardust
          for (var i = 0; i < floaters.length; i++) {
            var fl = floaters[i];
            var fx = ((fl.x + Math.sin(t * 0.85 + fl.phase) * fl.swayAmp) % 1 + 1) % 1 * w;
            var fy = ((fl.y - t * fl.vy) % 1 + 1) % 1 * h;
            if (pointer.active) {
              var dx = pointer.x * w - fx;
              var dy = pointer.y * h - fy;
              var dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 160 && dist > 1) {
                var pull = (1 - dist / 160) * 10;
                fx += (dx / dist) * pull;
                fy += (dy / dist) * pull;
              }
            }
            var pulse = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.9 + fl.phase));
            if (fl.isHeart) {
              drawHeart(fx, fy, fl.size, Math.sin(t * 1.1 + fl.phase) * 0.28, fl.color, pulse * 0.55);
            } else {
              ctx.save();
              ctx.globalAlpha = pulse * 0.5;
              ctx.fillStyle = fl.color;
              ctx.beginPath();
              ctx.arc(fx, fy, fl.size * 0.26, 0, 6.283);
              ctx.fill();
              ctx.restore();
            }
          }

          // 2. Expanding silk ripples on tap/click
          for (var r = ripples.length - 1; r >= 0; r--) {
            var rp = ripples[r];
            rp.r += dt * 115;
            rp.alpha -= dt * 0.62;
            if (rp.alpha <= 0.01) {
              ripples.splice(r, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = rp.alpha;
            ctx.strokeStyle = '#f5c6d8';
            ctx.lineWidth = 1.15;
            ctx.beginPath();
            ctx.arc(rp.x, rp.y, rp.r, 0, 6.283);
            ctx.stroke();
            ctx.restore();
          }

          // 3. Interactive cursor & tap heart-blooms
          for (var b = bursts.length - 1; b >= 0; b--) {
            var p = bursts[b];
            p.life += dt;
            if (p.life >= p.maxLife) {
              bursts.splice(b, 1);
              continue;
            }
            p.x += p.vx * dt + Math.sin(t * 4.5 + b) * 12 * dt;
            p.y += p.vy * dt;
            p.vy -= 14 * dt;
            var u = p.life / p.maxLife;
            var fade = Math.sin(u * Math.PI);
            drawHeart(p.x, p.y, p.size * (0.75 + 0.35 * fade), p.rot + u * 0.4, p.color, fade * 0.85);
          }

          rafId = requestAnimationFrame(frame);
        }
        rafId = requestAnimationFrame(frame);

        window.__bloomLoadingComplete = function () {
          if (w && h) spawnHeartBurst(w * 0.5, h * 0.46, 16);
        };
        window.__stopLoadingAmbient = function () {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('resize', resize);
        };
      })();
    </script>

    <div id="canvas-container"></div>
    <div id="hud-root" class="hud-entering"></div>
